name: ci

on:
  push:
    branches: [main, feature/**, refactor/**]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: lint-ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff check
        run: ruff check core platforms tests
        continue-on-error: true

  safety:
    name: safety-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run safety and core tests
        run: pytest tests/test_safety tests/test_core -q

      - name: Run Linux provider tests
        if: runner.os == 'Linux'
        run: pytest tests/test_linux -q

      - name: Run macOS provider tests
        if: runner.os == 'macOS'
        run: pytest tests/test_macos -q

      - name: Run Windows provider tests
        if: runner.os == 'Windows'
        run: pytest tests/test_windows -q
