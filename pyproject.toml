[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanup-os"
version = "0.1.0"
description = "Cross-platform disk cleanup tool with a safety-first architecture"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "customtkinter",
    "psutil",
    "Pillow",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
cleanup-os = "cli.main_cli:main"
cleanup-os-gui = "ui.main:main"

[tool.setuptools.packages.find]
include = [
    "core*",
    "platforms*",
    "ui*",
    "cli*",
]

[tool.setuptools.package-data]
ui = ["i18n/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
