    dst: /usr/bin/cleanup-os
    file_info:
      mode: 0755
  - src: packaging/BETA.md
    dst: /usr/share/doc/cleanup-os-beta/BETA.md
  - src: LICENSE
    dst: /usr/share/doc/cleanup-os-beta/LICENSE
overrides:
